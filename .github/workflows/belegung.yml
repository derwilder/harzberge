name: Belegung aktualisieren
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_belegung.py
      - run: python3 scripts/build_i18n.py
      - name: Änderungen committen
        run: |
          git config user.name "belegung-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data index.html en es
          git diff --cached --quiet || (git commit -m "Belegung aktualisiert" && git push)
