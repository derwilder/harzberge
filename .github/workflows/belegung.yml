name: Belegung aktualisieren und veröffentlichen
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_belegung.py
      - run: python3 scripts/build_i18n.py
      - name: Änderungen committen
        run: |
          git config user.name "belegung-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data index.html en es
          git diff --cached --quiet || (git commit -m "Belegung aktualisiert" && git push)
      - name: Auf harzberge.de hochladen (GreatNet, FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            scripts/**
            README.md
